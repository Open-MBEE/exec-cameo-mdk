# Example build profile. Copy to buildProfiles/<name>.properties (ignored by git) and
# build with ./gradlew -PbuildProfile=<name> <task>.
#
# Without a profile the build uses the "opensource" defaults and resolves the Cameo
# "no install" zip from ./libz, where it must be named
#   libz/democsm-2026xRefresh1-Cameo_Systems_Modeler_2026x_Refresh1_no_install.zip
# (the vendor file Cameo_Systems_Modeler_2026x_Refresh1_no_install.zip renamed to the
# <name>-<version>-<classifier>.zip layout of a Gradle flat directory repository).

# Comma-separated list of jars (relative to the extracted Cameo distribution) that must be
# loaded first, in this order. Copy the CLASSPATH entry from bin/csm.properties of your
# installation; most users do not need this.
# classpathLibraries = lib/md.jar,lib/md_api.jar,lib/md_common.jar,lib/md_common_api.jar

# Extra repositories to resolve nomagicDeps from. Credentials are read from the
# artifactoryUsername / artifactoryPassword Gradle properties when "credentials" is true.
# The layout pattern below matches an Artifactory generic repository holding the vendor zips
# as <repo>/<name><version>/<classifier>.zip.
# repositories = [{"type": "ivy", "url": "https://artifactory.example.org/artifactory/cameo-generic/", "layoutPattern": "/[module][revision]/[classifier].[ext]", "credentials": true}]

# Cameo distribution and plugin zips to resolve from the repositories above instead of ./libz.
# Every zip listed here is extracted into build/dependency-cache/extracted/magicdraw.
# nomagicDeps = [{"group": "com.nomagic", "name": "democsm", "version": "2026xRefresh1", "classifier": "Cameo_Systems_Modeler_2026x_Refresh1_no_install", "ext": "zip"}]

# Overrides the group of the published artifacts (org.openmbee -> <group>).
# group = org.example

# Java executable used by the runJava and test tasks instead of the toolchain JDK.
# executablePath = /opt/cameo/jre/bin/java
